<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact follow-up · Blueboot CRM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid py-3" id="cc-root" style="max-width:1100px">

    <!-- Feedback / status line -->
    <div id="cc-feedback" class="alert py-2 px-3 small mb-3" style="display:none"></div>

    <!-- Back link + header -->
    <div class="d-flex align-items-center gap-2 mb-3">
      <a href="crm_follow.html" id="cc-back" class="btn btn-sm btn-outline-secondary">
        <i class="ti ti-arrow-left me-1"></i>Back to list
      </a>
      <span id="cc-saved" class="small text-success" style="display:none">
        <i class="ti ti-check"></i> Saved
      </span>
    </div>

    <div id="cc-loading" class="text-muted small py-5 text-center">Loading contact…</div>

    <div id="cc-body" style="display:none">
      <!-- Header card -->
      <div class="card mb-3">
        <div class="card-body d-flex align-items-start gap-3 flex-wrap">
          <div class="cc-avatar" id="cc-avatar">?</div>
          <div class="flex-grow-1" style="min-width:240px">
            <input id="f-name" type="text" class="form-control form-control-lg fw-600 border-0 px-1"
                   placeholder="Name" data-field="name">
            <input id="f-title" type="text" class="form-control form-control-sm text-muted border-0 px-1"
                   placeholder="Title" data-field="title">
            <div class="mt-1" id="cc-status-badge"></div>
          </div>
          <div id="cc-newmail" class="align-self-center" style="display:none">
            <span class="badge bg-warning text-dark"><i class="ti ti-mail-opened me-1"></i>New mail</span>
            <button class="btn btn-sm btn-outline-secondary ms-1" id="cc-ack-btn">Mark read</button>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Left column: follow-up + contact + channels -->
        <div class="col-lg-5">
          <!-- Follow-up card -->
          <div class="card mb-3">
            <div class="card-header py-2 fw-600"><i class="ti ti-list-check me-1"></i>Follow-up</div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label small mb-1">Status</label>
                <select id="f-followup_status" class="form-select form-select-sm" data-field="followup_status"></select>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Next follow-up date</label>
                <input id="f-followup_date" type="date" class="form-control form-control-sm" data-field="followup_date">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Importance</label>
                <select id="f-followup_importance" class="form-select form-select-sm" data-field="followup_importance"></select>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Owner</label>
                <select id="f-followup_owner" class="form-select form-select-sm" data-field="followup_owner"></select>
              </div>
              <div class="mb-0">
                <label class="form-label small mb-1">Comment</label>
                <textarea id="f-followup_comment" class="form-control form-control-sm" rows="3"
                          placeholder="Internal note…" data-field="followup_comment"></textarea>
              </div>
            </div>
          </div>

          <!-- Contact methods -->
          <div class="card mb-3">
            <div class="card-header py-2 fw-600"><i class="ti ti-address-book me-1"></i>Contact</div>
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="ti ti-mail text-muted"></i>
                <a id="cc-email" href="#" class="small text-truncate">—</a>
              </div>
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="ti ti-phone text-muted"></i>
                <input id="f-phone" type="tel" class="form-control form-control-sm" placeholder="Phone" data-field="phone">
              </div>
              <div class="d-flex align-items-center gap-2">
                <i class="ti ti-world text-muted"></i>
                <input id="f-website" type="text" class="form-control form-control-sm" placeholder="Website" data-field="website">
              </div>
            </div>
          </div>

          <!-- Channels -->
          <div class="card mb-3">
            <div class="card-header py-2 fw-600"><i class="ti ti-plug-connected me-1"></i>Channels</div>
            <div class="card-body" id="cc-channels"></div>
          </div>
        </div>

        <!-- Right column: mail composer + history -->
        <div class="col-lg-7">
          <!-- Mail composer -->
          <div class="card mb-3">
            <div class="card-header py-2 fw-600 d-flex justify-content-between align-items-center">
              <span><i class="ti ti-send me-1"></i>Send mail</span>
              <span class="small text-muted" id="cc-mail-from">—</span>
            </div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label small mb-1">To</label>
                <input id="cc-mail-to" type="text" class="form-control form-control-sm" readonly>
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Subject</label>
                <input id="cc-mail-subject" type="text" class="form-control form-control-sm" placeholder="Subject">
              </div>
              <div class="mb-2">
                <label class="form-label small mb-1">Body</label>
                <div id="cc-mail-editor" style="height:200px"></div>
              </div>
              <div id="cc-mail-feedback" class="alert py-2 px-3 small mb-2" style="display:none"></div>
              <button id="cc-mail-send" class="btn btn-primary btn-sm">
                <i class="ti ti-send me-1"></i>Send mail
              </button>
            </div>
          </div>

          <!-- History -->
          <div class="card mb-3">
            <div class="card-header py-2 fw-600 d-flex justify-content-between align-items-center">
              <span><i class="ti ti-history me-1"></i>History</span>
              <span class="badge bg-secondary" id="cc-hist-count">0</span>
            </div>
            <div class="card-body" id="cc-history"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crm-common.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="js/crm-defs.js"></script>
  <script src="js/crm-contact.js"></script>
</body>
</html>
